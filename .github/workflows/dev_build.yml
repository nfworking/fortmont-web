name: Dev Build

on:
  workflow_run:
    workflows:
      - Dev Lint
    types:
      - completed

jobs:
  build:
    runs-on: self-hosted
    if: contains(fromJson('["success","neutral"]'), github.event.workflow_run.conclusion)
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
         

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run build
        run: pnpm build:cicd