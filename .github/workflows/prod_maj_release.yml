name: Production Major Release

permissions:
  contents: write

on:
  workflow_run:
    workflows:
      - Production Automated Security Checks
    types:
      - completed

jobs:
  build:
    runs-on: self-hosted

    if: |
      github.event.workflow_run.conclusion == 'success' ||
      github.event.workflow_run.conclusion == 'neutral'

    steps:
      - name: Checkout tested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run build
        run: pnpm build:cicd

      - name: Check major release eligibility
        id: version_gate
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const cp = require('child_process');

            const current = JSON.parse(
              fs.readFileSync('package.json', 'utf8')
            ).version;

            let previous = '';

            try {
              const latestTag = cp.execSync(
                'git describe --tags --abbrev=0',
                { encoding: 'utf8' }
              ).trim();

              previous = latestTag.replace(/^v/, '');
            } catch {
              previous = '';
            }

            const semver = /^(\d+)\.(\d+)\.(\d+)$/;

            const currentMatch = current.match(semver);
            const previousMatch = previous.match(semver);

            let shouldTag = false;

            if (currentMatch) {
              if (!previousMatch) {
                shouldTag = true;
              } else {
                const currentMajor = Number(currentMatch[1]);
                const previousMajor = Number(previousMatch[1]);

                shouldTag = currentMajor > previousMajor;
              }
            }

            core.setOutput('current', current);
            core.setOutput('should_tag', shouldTag ? 'true' : 'false');

            core.info(`Current version: ${current}`);
            core.info(`Latest release tag: ${previous || '(none)'}`);
            core.info(`Major release: ${shouldTag}`);

      - name: Create and push tag
        if: steps.version_gate.outputs.should_tag == 'true'
        uses: actions/github-script@v7
        env:
          RELEASE_VERSION: ${{ steps.version_gate.outputs.current }}
        with:
          script: |
            const cp = require('child_process');

            const tag = `v${process.env.RELEASE_VERSION}`;

            try {
              cp.execSync(
                `git ls-remote --exit-code origin refs/tags/${tag}`,
                { stdio: 'ignore' }
              );

              core.info(`Tag ${tag} already exists. Skipping.`);
              return;

            } catch {
              // Tag does not exist
            }

            cp.execSync(
              'git config user.name "github-actions[bot]"'
            );

            cp.execSync(
              'git config user.email "41898282+github-actions[bot]@users.noreply.github.com"'
            );

            cp.execSync(`git tag ${tag}`);
            cp.execSync(`git push origin ${tag}`, {
              stdio: 'inherit'
            });

            core.info(`Created and pushed ${tag}`);