name: Pull Request Checks

on:
  pull_request:
    branches:
      - main

jobs:
  test:
    name: PR Validation
    runs-on: self-hosted

    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Linter
        run: pnpm lint

      - name: Run build
        run: pnpm build:cicd

      - name: Security scans
        run: pnpm audit
        continue-on-error: true