name: Production Automated Security Checks

on:
  workflow_run:
    workflows:
      - Prod Lint
    types:
      - completed

jobs:
  audit:
    runs-on: self-hosted
    if: contains(fromJson('["success","neutral"]'), github.event.workflow_run.conclusion)

    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
    

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Auditor
        run: pnpm audit
        continue-on-error: true